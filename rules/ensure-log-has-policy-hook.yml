# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: ensure-log-has-policy-hook
message: ensure newly created logs have a policy hook
severity: warning
language: zeek

rule:
  kind: expr
  all:
    - has:
        kind: id
        pattern: 'Log::create_stream'
    - not:
        has:
          kind: expr
          pattern: $policy=
          stopBy: end

note: |
  Newly created log streams _should_ be created with a defined and exported
  `Log::PolicyHook` so downstream consumers can filter logs as they please.
