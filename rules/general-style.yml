# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: prefer-network-time-to-current-time
message: use network_time() instead of current_time()
severity: warning
language: zeek

rule:
  kind: expr
  has:
    kind: id
    pattern: current_time

fix: "network_time()"

note: |
  Zeek’s network time is driven by the timestamps of the packets it processes.
  Instead, current time always refers to the current wall clock. When running on
  PCAPs, e.g. for testing content, using `network_time()` allows to establish
  determinism. When running live, using `network_time()` will help to maintain
  exact results, even if packet processing gets delayed in overload situations.

---
id: print-is-not-a-function
message: avoid parenthese around the argument to `print` statement
severity: warning
language: zeek

rule:
  kind: stmt
  all:
    - has:
        pattern: 'print'
    - has:
        kind: expr_list
        pattern: '$ARGS'
        has:
          kind: expr
          has:
            pattern: '('

# Hack to trim the () surrounding $ARGS.
transform:
  NEW_VAR:
    substring:
      source: $ARGS
      startChar: 1
      endChar: -1

fix: "print $NEW_VAR;"

note: |
  `print` is not a function call. It’s helpful for `print` statements to stand
  out visually as generally they’re only used for debugging.

---
id: omit-unnecessary-initializations
message: container types are automatically initialized as empty
severity: warning
language: zeek

rule:
  kind: initializer
  has:
    kind: expr
    any:
      - pattern: 'set()'
      - pattern: 'vector()'
      - pattern: 'table()'

# This sadly leaves a space hanging around between the type and the ; at the end
# of the statement, due to how the parse tree is constructed. It's possible this
# could be fixed with the `expandStart` parameter, but I wasn't able to get it
# to work. See https://ast-grep.github.io/reference/yaml/fix.html
fix: ""

note: |
  Zeek automatically initializes tables, sets and vectors to empty containers.
  Adding an explicit initializer leads the reader to expect that the variable
  starts off non-empty, until they scan the initializer and see that that’s not
  the case.

---
id: default-attribute-overrides-optional
message: default attribute overrides (unnecessary) optional attribute
severity: warning
language: zeek

rule:
  kind: attr_list
  pattern: $ATTRS
  all:
    - has:
        kind: attr
        has:
          pattern: '&optional'
    - has:
        kind: attr
        has:
          pattern: '&default'

transform:
  WITHOUT_OPTIONAL:
    replace:
      replace: ' &optional'
      by: ''
      source: $ATTRS

fix: $WITHOUT_OPTIONAL
